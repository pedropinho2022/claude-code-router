name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - claude/funny-johnson-1t6cfy

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build:app:win:local

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: claude-code-router-windows
          path: release-local/*.exe
          if-no-files-found: error
          retention-days: 30
